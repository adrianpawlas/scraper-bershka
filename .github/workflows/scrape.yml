name: Scrape Bershka

on:
  # Daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Manual runs
  workflow_dispatch:
    inputs:
      scrape_mode:
        description: 'Scrape mode (full/test)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - test

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 12 hours = 720 minutes

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Verify Supabase credentials
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
          echo "ERROR: SUPABASE_URL or SUPABASE_KEY not set. Add them in Settings → Secrets → Actions."
          exit 1
        fi
        echo "Supabase credentials present"

    - name: Run Bershka scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PRODUCT_LIMIT: ${{ github.event.inputs.scrape_mode == 'test' && '10' || '0' }}
      run: |
        if [ "${{ github.event.inputs.scrape_mode }}" = "test" ]; then
          echo "Running in test mode with 10 products..."
          python bershka_scraper.py
        else
          echo "Running full scrape..."
          python bershka_scraper.py
        fi

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs-${{ github.run_id }}
        path: |
          *.log
          logs/
